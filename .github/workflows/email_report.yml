name: Weekly Portfolio Email

on:
  schedule:
    # 08:00 UTC = 10:00 AM SAST (Runs every Monday '1')
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows you to test it manually anytime

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Script & Send Email
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python main.py